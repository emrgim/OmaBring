[workspace]
resolver = "2"
members = [
    "crates/omabring-core",
    "crates/omabring-stores",
    "crates/omabring-mcp",
    "crates/omabring-service",
    "crates/omabring",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["emrgim"]
description = "OmaBring, a native Omarchy app for UAE grocery shopping"
repository = "https://github.com/emrgim/OmaBring"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chacha20poly1305 = "0.10"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
toml = "0.8"
tempfile = "3"
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
