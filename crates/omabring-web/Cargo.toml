[package]
name = "omabring-web"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "OmaBring dashboard and HTTP server"

[dependencies]
axum = "0.7"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
omabring-core = { path = "../omabring-core" }
omabring-mcp = { path = "../omabring-mcp" }
omabring-oauth = { path = "../omabring-oauth" }
omabring-stores = { path = "../omabring-stores" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tower-http = { version = "0.5", features = ["compression-gzip", "cors"] }
